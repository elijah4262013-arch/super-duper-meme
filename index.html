<!DOCTYPE html>
<!--
 * Weather Radar Pro
 * Advanced Weather Radar Visualization Tool
 * 
 * @description: Web-based application for viewing real-time weather radar data
 * @version: 2.0.0
 * @license: MPL 2.0
 * @author: elijah4262013-arch
 * @repository: https://github.com/elijah4262013-arch/super-duper-meme
 * 
 * Features:
 * - Multiple radar modes: Reflectivity, Velocity, OpenMeteo, Composite
 * - Interactive Leaflet map with multiple base layers
 * - Real NWS/NOAA radar data via ArcGIS MapServer
 * - Location services and custom coordinates
 * - Responsive design for desktop and mobile
 * 
 * Data Sources:
 * - NOAA NWS ArcGIS MapServer (https://idpgis.ncep.noaa.gov/)
 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Advanced Weather Radar - View real-time NWS reflectivity and velocity data on an interactive map">
    <meta name="keywords" content="weather, radar, reflectivity, velocity, NWS, NOAA, Doppler, meteorology">
    <meta name="author" content="elijah4262013-arch">
    <title>Weather Radar Pro - NWS Radar Data</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <div class="header">
        <div>
            <h1>☁️ Weather Radar Pro</h1>
            <div class="header-subtitle">NWS Reflectivity • Velocity • Real Data</div>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="control-panel">
                <h2>📡 Radar Mode</h2>
                <div class="mode-buttons">
                    <button class="btn active" onclick="setMode('reflectivity')" id="btn-reflectivity">
                        🌧️ Reflectivity
                    </button>
                    <button class="btn" onclick="setMode('velocity')" id="btn-velocity">
                        🔭 Velocity
                    </button>
                </div>
            </div>

            <div class="control-panel">
                <h2>⚙️ Settings</h2>
                <div class="control-group">
                    <label for="opacity">Opacity:</label>
                    <input type="range" id="opacity" min="10" max="100" value="70" oninput="updateOpacity(this.value)">
                </div>
                <div class="control-group">
                    <label for="location">Location:</label>
                    <select id="location" onchange="changeLocation(this.value)">
                        <option value="us">United States</option>
                        <option value="custom">Custom Coordinates</option>
                    </select>
                </div>
                <button class="btn" onclick="locateMe()">
                    📍 Locate Me
                </button>
            </div>

            <div class="legend" id="legend">
                <h3>Legend</h3>
                <div class="legend-scale" id="legend-scale"></div>
                <div class="legend-labels">
                    <span>Light</span>
                    <span>Heavy</span>
                </div>
                <div style="margin-top: 10px; font-size: 0.8rem;">
                    <div id="legend-title">Reflectivity (dBZ)</div>
                </div>
            </div>

            <div class="status">
                <h3>📊 Status</h3>
                <div class="status-item">
                    <span>Mode:</span>
                    <span class="status-value" id="status-mode">Reflectivity</span>
                </div>
                <div class="status-item">
                    <span>Zoom:</span>
                    <span class="status-value" id="status-zoom">4</span>
                </div>
                <div class="status-item">
                    <span>Lat/Lng:</span>
                    <span class="status-value" id="status-coords">0, 0</span>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div id="map"></div>
            <div class="loading" id="loading">Loading NWS Radar Data...</div>
            <div class="radar-info" id="radar-info">
                <h3>📡 Radar Information</h3>
                <p id="radar-name">US National Radar</p>
                <p id="radar-time">Time: --:-- UTC</p>
            </div>
            <div class="attribution" id="attribution">
                Data: <a href="https://www.weather.gov/" target="_blank">NOAA NWS</a>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
